<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="style.css" />
    <title>AI Companion · Sign in</title>
    <style>
      .login { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; }
      .login img { width: 96px; height: 96px; border-radius: 50%; }
      .login form { display: flex; flex-direction: column; gap: 10px; width: min(320px, 100%); }
      .login input { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--tile); font-size: 16px; }
      .login .err { color: var(--danger); min-height: 1.2em; font-size: 14px; text-align: center; }
    </style>
  </head>
  <body>
    <main class="login">
      <img src="icon-192.png" alt="" />
      <h1 style="margin: 0; font-size: 22px">AI Companion</h1>
      <form id="f">
        <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus />
        <button class="btn primary">Sign in</button>
        <div id="err" class="err"></div>
      </form>
    </main>
    <script>
      document.getElementById("f").onsubmit = async (e) => {
        e.preventDefault();
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("pw").value }),
        });
        if (r.ok) location.href = "/";
        else document.getElementById("err").textContent = (await r.json().catch(() => ({}))).error || "Sign-in failed";
      };
    </script>
  </body>
</html>
